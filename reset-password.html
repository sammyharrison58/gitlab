<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset the password for your Rent Master account.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="auth.js" defer></script>
    <title>Reset password | Rent Master</title>
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <a href="index.html" class="logo">Rent Master</a>
            <ul class="nav-links"><li><a href="findahome.html">Find a home</a></li><li><a href="login.html">Log in</a></li></ul>
        </nav>
    </header>
    <main class="auth-page">
        <section class="form-card reset-card">
            <h1>Reset your password</h1>
            <p class="auth-form-intro">We’ll send a secure reset link to your verified email address.</p>
            <p class="auth-status" id="auth-status" role="status" aria-live="polite" data-requires-backend hidden></p>
            <form id="request-reset-form">
                <div class="form-field"><label for="reset-email">Email address</label><input id="reset-email" type="email" autocomplete="email" required></div>
                <button type="submit" id="reset-submit">Send reset link</button>
            </form>
            <form id="update-password-form" hidden>
                <div class="form-field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="12" autocomplete="new-password" required><small>Use at least 12 characters.</small></div>
                <button type="submit" id="update-password-submit">Update password</button>
            </form>
            <p class="auth-status" id="reset-message" role="status" aria-live="polite"></p>
            <p class="auth-switch"><a href="login.html">Return to log in</a></p>
        </section>
    </main>
    <footer><p>&copy; 2026 Rent Master. All rights reserved.</p></footer>
</body>
</html>
